name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    name: Hooks (Ruff / Black / format_lint / tests / build_checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Same declarative checks as local pre-commit (tools/hooks.yaml):
      # format_lint (Ruff format/check, Black) → tests (bazel test //...) → build_checks.
      - name: Format / lint, tests, and build checks
        run: ./tools/run-hooks.sh
