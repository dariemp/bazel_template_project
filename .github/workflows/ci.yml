name: CI

on:
  push:
    branches: [main, lighter-cc-toolchain]
  pull_request:
  workflow_dispatch:

jobs:
  hooks:
    name: prek hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only host bootstrap: Bazelisk (reads .bazelversion). Every other tool,
      # including prek itself, is fetched and pinned by Bazel (MODULE.bazel).
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # One GHA step per hook id from .pre-commit-config.yaml.
      - name: "Python: format (Ruff)"
        run: bazel run //tools:prek -- run format-ruff --all-files

      - name: "Python: format (Black)"
        run: bazel run //tools:prek -- run format-black --all-files

      - name: "Python: lint (Ruff)"
        run: bazel run //tools:prek -- run lint-ruff --all-files

      - name: "Python: type check (mypy)"
        run: bazel run //tools:prek -- run typecheck-mypy --all-files

      - name: "Go: format (gofmt)"
        run: bazel run //tools:prek -- run gofmt --all-files

      - name: "Go: vet (nogo)"
        run: bazel run //tools:prek -- run go-vet --all-files

      - name: "Go: Gazelle"
        run: bazel run //tools:prek -- run gazelle --all-files

      - name: "TypeScript: format (Prettier)"
        run: bazel run //tools:prek -- run format-prettier --all-files

      - name: "TypeScript: lint (ESLint)"
        run: bazel run //tools:prek -- run lint-eslint --all-files

      - name: "TypeScript: type check (tsc)"
        run: bazel run //tools:prek -- run typecheck-tsc --all-files

      - name: "Rust: format (rustfmt)"
        run: bazel run //tools:prek -- run rustfmt --all-files

      - name: "Rust: lint (Clippy)"
        run: bazel run //tools:prek -- run clippy --all-files

      - name: "C/C++: toolchain diagnostics"
        if: always()
        run: |
          xcode-select -p || true
          bazel build //cpp/calculator:calculator --toolchain_resolution_debug='@bazel_tools//tools/cpp:toolchain_type' 2>&1 | grep -i "selected" || true
          bazel aquery 'mnemonic("CppCompile", //cpp/calculator:calculator)' | grep -E "Command Line|zig|isysroot|SDKs" || true
          file bazel-bin/cpp/calculator/calculator_test || true
          otool -L bazel-bin/cpp/calculator/calculator_test || true

      - name: "C/C++: format (clang-format)"
        run: bazel run //tools:prek -- run clang-format --all-files

      - name: "C/C++: lint (clang-tidy)"
        run: bazel run //tools:prek -- run clang-tidy --all-files

      - name: "Starlark: Buildifier"
        run: bazel run //tools:prek -- run buildifier --all-files

      - name: "Tests (bazel test //...)"
        run: bazel run //tools:prek -- run tests --all-files

  # Native macOS check for the zig cc toolchain and the PyPI clang tools.
  macos:
    name: macOS (C/C++ + clang hooks)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-macos
          repository-cache: true

      - name: "C/C++: build + test"
        run: bazel test //c/... //cpp/...

      - name: "C/C++: format (clang-format)"
        run: bazel run //tools:prek -- run clang-format --all-files

      - name: "C/C++: lint (clang-tidy)"
        run: bazel run //tools:prek -- run clang-tidy --all-files
