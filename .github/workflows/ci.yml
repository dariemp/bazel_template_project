name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    name: Native hooks (bazel / gofmt / buildifier / gazelle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Same declarative checks as local pre-commit (tools/hooks.yaml).
      - name: Run hooks
        run: ./tools/run-hooks.sh
