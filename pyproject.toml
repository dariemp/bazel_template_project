[build-system]
requires = ["uv_build >= 0.8.17, <0.9.0"]
build-backend = "uv_build"

[project]
name = "bazel-template-project"
version = "1.0"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.0",
    "whitespace-format==0.0.8",
    "ruff>=0.8",
    "black>=24.0",
]

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.ruff]
target-version = "py313"
line-length = 88
