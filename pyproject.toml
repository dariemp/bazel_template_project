[build-system]
requires = ["uv_build >= 0.8.17, <0.9.0"]
build-backend = "uv_build"

[project]
name = "bazel-template-project"
version = "1.0"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.0",
    "whitespace-format==0.0.8",
    "ruff>=0.8",
    "black>=24.0",
    "mypy>=1.18",
    # C/C++ tooling: official LLVM wheels, used by //tools/cpp (keep in sync
    # with the zig/clang major where practical).
    "clang-format==22.1.8",
    "clang-tidy==22.1.8",
]

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
exclude = ["^bazel-"]

# Third-party packages without type information.
[[tool.mypy.overrides]]
module = ["whitespace_format", "whitespace_format.*"]
ignore_missing_imports = true
